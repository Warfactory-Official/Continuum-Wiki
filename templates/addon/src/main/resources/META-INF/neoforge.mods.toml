modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "${mod_license}"
{{#links}}
issueTrackerURL = "@golem.issues@"
{{/links}}

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
{{#links}}
displayURL = "@golem.homepage@"
{{/links}}
authors = "${mod_author}"
description = '''${mod_description}@golem.credits@'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

# AFTER both: the mod's constructor uses Golem Core's mod bus and HBM's registries.
[[dependencies.${mod_id}]]
modId = "golemcore"
type = "required"
versionRange = "[${golemcore_floor},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "hbm"
type = "required"
versionRange = "[${hbm_floor},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
