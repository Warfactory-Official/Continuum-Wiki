# Per-node dependency versions, equal to the NTM - Continuum build this node runs on.
# GemRender's CurseForge file id (CurseMaven) for this node. It is optional for players and only in the dev client run;
# -Pgemrender.run=false launches without it.
deps.gemrender={{gemFile}}
