# Per-node dependency versions, equal to the NTM - Continuum build this node runs on.
# CurseForge file ids (CurseMaven): Golem Core, NTM - Continuum and GemRender for this node. GemRender is optional for
# players and only in the dev client run; -Pgemrender.run=false launches without it.
